name: Tests

on:
  push:
    branches: main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            down -v
