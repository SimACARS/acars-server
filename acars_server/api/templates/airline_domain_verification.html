<!DOCTYPE html>
<html>
<body>
<h1>Airline Domain Verification</h1>
<p>To verify your airline domain ownership, please add the following TXT record to your domain's DNS settings:</p>
<p>_acars-verification.{{ domain }}. IN TXT "acars-verify-{{ verification_token }}"</p>
<p>Once you've added the TXT record, click <a href="/airline/domain_auth/{{ verification_token }}">here</a> to complete registration</p>
</body>
</html>
