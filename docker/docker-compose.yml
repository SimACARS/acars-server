services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 9Bo9pcHwoW0xsqWFB34sVL
      MYSQL_DATABASE: acars_test
      MYSQL_USER: acars
      MYSQL_PASSWORD: tC1Pu9oQ5TFpZttQ6D97Hqw7L71
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p9Bo9pcHwoW0xsqWFB34sVL"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel:
    build:
      context: ..
      dockerfile: docker/otel.Dockerfile

  tests:
