      - ../htmlcov:/app/htmlcov
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: acars
      MYSQL_PASSWORD: tC1Pu9oQ5TFpZttQ6D97Hqw7L71
      MYSQL_DB: acars

